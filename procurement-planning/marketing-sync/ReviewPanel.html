<!doctype html><html lang="zh-Hant"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#fbf8f1;color:#17324d;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC",sans-serif}main{padding:18px;max-width:100%;overflow-wrap:anywhere}h1{font-size:21px;margin:0 0 8px}h2{font-size:18px;margin:0 0 8px}p{margin:6px 0}.guide,.card,.reviewbar{background:#fff;border:1px solid #d8e4e8;border-radius:16px;padding:16px;margin:12px 0;min-width:0}.guide{background:#edf6f8}.muted{color:#64778a}.error{color:#993c29;background:#fff0e8;padding:10px;border-radius:8px;white-space:pre-wrap}.success{color:#2f725b}.notice{min-height:1.6em;white-space:pre-wrap}button,input,select{font:inherit;max-width:100%}button{background:#176b87;color:white;border:0;border-radius:10px;padding:10px 15px;cursor:pointer}button.secondary{background:#fff;color:#153f63;border:1px solid #b5ccd5}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #176b87;outline-offset:2px}.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:12px 0}.actions.end{justify-content:space-between}.line{display:flex;gap:10px;align-items:flex-start}.line input{margin-top:7px;flex:0 0 auto}input[type=text],select{display:block;width:100%;padding:10px;border:1px solid #b5ccd5;border-radius:9px;background:#fff;color:#17324d}.searchline{display:grid;grid-template-columns:140px minmax(0,1fr) auto;gap:12px;align-items:end}label{display:block;min-width:0}details{margin:8px 0}summary{cursor:pointer}ul{padding-left:22px}strong{color:#153f63}.results{max-height:310px;overflow:auto;border:1px solid #d8e4e8;border-radius:10px}.result{display:flex;gap:10px;padding:10px;border-bottom:1px solid #d8e4e8;align-items:flex-start}.result:last-child{border-bottom:0}.result input{margin-top:7px}.result span{min-width:0;overflow-wrap:anywhere}.result small{display:block;color:#64778a}.reviewbar{border-top:3px solid #176b87}.reviewbar .actions{margin-bottom:0}[hidden]{display:none!important}@media(max-width:620px){.searchline{grid-template-columns:1fr}.searchline button{width:100%}}@media(max-width:400px){main{padding:10px}.card,.guide,.reviewbar{padding:12px}.actions button{width:100%}}
</style></head><body><main>
<h1>活動覆核（條件與商品一次完成）</h1>
<div class="guide"><strong id="step">目前狀態：尚未讀取</strong><p id="next">下一步：讀取最新活動，核對名稱及商品異動。</p><button class="secondary" id="load">重新讀取預覽</button></div>
<p class="muted">新增商品只更新候選清單，不代表活動已覆核；核對下方條件及商品後，再到最下方統一覆核。不發布採購或周調撥。</p>
<section id="manual" hidden class="card" aria-label="搜尋並批次新增活動商品">
<h2>搜尋並批次新增商品</h2><p><strong id="target"></strong></p>
<div class="searchline"><label>查找方式<select id="searchKind"><option value="sku">ERP品號</option><option value="name">商品品名／關鍵字</option></select></label><label>查找內容<input id="sku" type="text" maxlength="500" autocomplete="off" placeholder="輸入品號或品名關鍵字"></label><button id="search">搜尋商品</button></div>
<p class="muted">可跨頁累積勾選，最後再批次加入。「全選本頁」只選本頁；「全選所有搜尋結果」包含其他頁。已加入、客製／特殊規格及下架品會略過；選取本身不會新增或覆核。</p>
<div class="actions" aria-label="商品選取操作"><button id="selectPage" class="secondary" disabled>全選本頁可加入商品</button><button id="selectAll" class="secondary" disabled>全選所有搜尋結果</button><button id="unselectPage" class="secondary" disabled>取消本頁勾選</button></div>
<p id="manualFeedback" class="notice" role="status" aria-live="polite"></p><p id="searchCount"></p><p id="basketCount" role="status" aria-live="polite">跨頁已選0筆，尚未加入</p><div id="results" class="results" hidden></div>
<div class="actions"><button id="prev" class="secondary" disabled>上一頁</button><button id="more" class="secondary" disabled>下一頁</button><button id="clearSearch" class="secondary">清除已選</button><button id="add" disabled>批次加入已選商品（0）</button></div>
</section>
<p id="feedback" class="notice" role="status" aria-live="polite"></p><section id="offers" aria-label="活動與商品核對"></section>
<section class="reviewbar" aria-label="活動覆核操作"><strong id="reviewCount">已勾選0個活動</strong><p class="muted">此處確認的是活動條件與整份商品清單，不是上方搜尋商品的勾選。</p><div class="actions end"><button class="secondary" id="choose">勾選可確認項目</button><button id="confirm">覆核勾選活動（條件與商品）</button></div></section>
</main><script>
const MODE=<?!= JSON.stringify(mode) ?>,ID=<?!= JSON.stringify(offerId) ?>,REVIEW_VERSION=<?!= JSON.stringify(reviewVersion) ?>;
let data=null,busy=false,targetId=ID,searchData=null,lastSearch=null,basket=new Map();
const $=id=>document.getElementById(id),el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;};
function reviewCount(){const n=[...document.querySelectorAll('[data-offer]:checked')].length;$('reviewCount').textContent='已勾選'+n+'個活動';$('confirm').disabled=busy||!data||!n;}
function searchControls(){const n=basket.size;$('add').textContent='批次加入已選商品（'+n+'）';$('basketCount').textContent='跨頁已選'+n+'筆，尚未加入';$('add').disabled=busy||!data||!n;$('search').disabled=busy||!data||!targetId;$('choose').disabled=busy||!data;$('prev').disabled=busy||!searchData||searchData.offset===0;$('more').disabled=busy||!searchData?.hasMore;['selectPage','selectAll','unselectPage'].forEach(id=>$(id).disabled=busy||!data||!searchData);}
function lock(value){busy=value;['load','confirm','add','choose','search','clearSearch','prev','more','sku','searchKind','selectPage','selectAll','unselectPage'].forEach(id=>$(id).disabled=value);document.querySelectorAll('[data-offer]').forEach(n=>n.disabled=value||!!n.dataset.error);document.querySelectorAll('[data-sku]').forEach(n=>n.disabled=value||n.dataset.blocked==='yes');searchControls();reviewCount();}
function fail(e){lock(false);$('step').textContent='目前狀態：操作未完成';$('next').textContent='請查看原因，保留輸入與勾選，不會自動重送。';$('feedback').className='error';$('feedback').textContent=e.message||String(e);}
function manualFail(e){lock(false);$('step').textContent='目前狀態：商品操作未完成';$('next').textContent='請查看新增區原因；輸入與已選商品保留，不會自動重送。';$('manualFeedback').className='error';$('manualFeedback').textContent=e.message||String(e);}
function setTarget(id){const o=data?.offers.find(x=>x.id===id);if(!o||o.noProductList)return;if(basket.size){$('manualFeedback').className='error';$('manualFeedback').textContent='請先加入或清除目前已選商品，再切換活動。';return;}targetId=id;$('manual').hidden=false;$('target').textContent='加入至：'+o.name+'｜'+o.id;searchData=null;lastSearch=null;$('results').replaceChildren();$('results').hidden=true;$('searchCount').textContent='';$('manualFeedback').textContent='';searchControls();$('sku').focus();}
function render(result){
 const checked=new Set([...document.querySelectorAll('[data-offer]:checked')].map(n=>n.dataset.offer));data=result;$('offers').replaceChildren();$('feedback').textContent='';$('step').textContent='目前狀態：已讀取 '+result.offers.length+' 個活動';$('next').textContent='下一步：核對活動卡片；如需加品先搜尋並加入，最後到下方活動覆核操作確認。';
 result.offers.forEach(o=>{const card=el('article',undefined,'card'),line=el('label',undefined,'line'),check=el('input');check.type='checkbox';check.dataset.offer=o.id;check.dataset.error=o.error||'';check.disabled=!!o.error;check.checked=checked.has(o.id)&&!o.error;check.onchange=reviewCount;line.append(check,el('strong',o.name+'｜'+o.id));card.append(line,el('p',o.noProductList?o.status:'候選'+o.count+'筆｜已選'+o.selected+'筆｜'+o.status));
 card.append(el('p','活動期間：'+(o.period||'活動期間待確認')),el('p','適用範圍：'+(o.scope||'')));const terms=el('details');terms.append(el('summary','查看活動條件與排除'),el('p',o.conditions||''),el('p','排除：'+(o.exclusions||'')));card.append(terms);
 if(!o.noProductList)card.append(el('p',(o.hasPrevious?'本次新增：':'尚無舊版選取快照，目前已選：')+(o.added.join('、')||'無')),el('p','本次取消：'+(o.removed.join('、')||'無')));if(o.error)card.append(el('p',o.error,'error'));
 if(!o.noProductList){const details=el('details'),summary=el('summary','查看候選與人工新增品號'),list=el('ul');o.products.forEach(p=>list.append(el('li',(p.selected?'已選':'未選')+'｜'+p.sku+' '+p.name+(p.manual?'（人工新增）':''))));details.append(summary,list);card.append(details);const open=el('button','搜尋／批次新增本活動商品','secondary');open.onclick=()=>{if(!busy)setTarget(o.id);};card.append(open);}$('offers').append(card);});
 lock(false);if(MODE!=='all'&&result.offers[0]&&!result.offers[0].noProductList){$('manual').hidden=false;$('target').textContent='加入至：'+result.offers[0].name+'｜'+result.offers[0].id;targetId=result.offers[0].id;}else if(!targetId||result.offers.find(x=>x.id===targetId)?.noProductList)$('manual').hidden=true;
}
function load(){if(busy)return;if(basket.size){$('manualFeedback').className='error';$('manualFeedback').textContent='尚有已選商品未加入；請先加入或清除已選，再重新讀取。';return;}lock(true);$('step').textContent='目前狀態：正在核對來源與商品主檔';$('next').textContent='完成後顯示預覽，尚未確認或發布。';google.script.run.withSuccessHandler(render).withFailureHandler(fail).loadMarketingReview(MODE,ID,REVIEW_VERSION);}
function showSearch(r){searchData=r;lock(false);$('results').replaceChildren();$('results').hidden=false;const counts=r.counts;$('searchCount').textContent='找到'+r.total+'筆；本頁'+r.rows.length+'筆（第'+(r.offset+1)+'筆起）'+(counts?'；可加入'+counts.available+'筆、已在活動'+counts.existing+'筆、排除'+counts.excluded+'筆、查無'+counts.missing+'筆':'');r.rows.forEach(p=>{const label=el('label',undefined,'result'),c=el('input');c.type='checkbox';c.dataset.sku=p.sku;c.dataset.blocked=p.available?'no':'yes';c.disabled=!p.available;c.checked=basket.has(p.sku);c.onchange=()=>{if(c.checked)basket.set(p.sku,p);else basket.delete(p.sku);searchControls();};const text=el('span');text.append(el('strong',p.sku+'｜'+p.name),el('small','規格：'+(p.size||'未提供')+'｜'+(p.reason||'可加入')));label.append(c,text);$('results').append(label);});searchControls();$('manualFeedback').className='notice';$('manualFeedback').textContent=r.total?'可勾選本頁或跨頁累積，最後再批次加入。':'沒有符合的商品，請調整品號或關鍵字。';}
function selectPage(value){if(busy||!searchData)return;searchData.rows.filter(p=>p.available).forEach(p=>{if(value)basket.set(p.sku,p);else basket.delete(p.sku);});document.querySelectorAll('[data-sku]').forEach(n=>n.checked=basket.has(n.dataset.sku));searchControls();}
function selectAllResults(){if(busy||!data||!lastSearch||!searchData)return;const spec=lastSearch,offset=searchData.offset;lock(true);$('manualFeedback').className='notice';$('manualFeedback').textContent='正在核對所有搜尋結果；只累積勾選，尚未加入…';google.script.run.withSuccessHandler(r=>{r.eligibleSkus.forEach(sku=>basket.set(sku,{sku}));showSearch(r);$('manualFeedback').textContent='已選取所有搜尋結果中可加入的'+r.eligibleSkus.length+'筆，跨頁共'+basket.size+'筆；確認後按批次加入。';}).withFailureHandler(manualFail).searchMarketingProducts(targetId,data.run,spec.query,spec.kind,offset,REVIEW_VERSION,true);}
function search(offset=0,continuing=false){if(busy||!data||!targetId)return;const spec=continuing?lastSearch:{query:$('sku').value,kind:$('searchKind').value};if(!spec)return;if(!continuing){if(basket.size){$('manualFeedback').className='error';$('manualFeedback').textContent='尚有已選商品未加入，請先加入或清除已選，再開始新搜尋。';return;}lastSearch=spec;}lock(true);$('manualFeedback').className='notice';$('manualFeedback').textContent='正在查詢最新商品主檔，尚未新增…';google.script.run.withSuccessHandler(showSearch).withFailureHandler(manualFail).searchMarketingProducts(targetId,data.run,spec.query,spec.kind,offset,REVIEW_VERSION);}
$('load').onclick=load;$('choose').onclick=()=>{document.querySelectorAll('[data-offer]:not(:disabled)').forEach(n=>n.checked=true);reviewCount();};
$('selectPage').onclick=()=>selectPage(true);$('unselectPage').onclick=()=>selectPage(false);$('selectAll').onclick=selectAllResults;
$('search').onclick=()=>search();$('sku').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();search();}};$('prev').onclick=()=>search(Math.max(0,searchData.offset-50),true);$('more').onclick=()=>search(searchData.offset+50,true);$('clearSearch').onclick=()=>{basket.clear();document.querySelectorAll('[data-sku]').forEach(n=>n.checked=false);searchControls();};
$('confirm').onclick=()=>{if(busy||!data)return;const ids=[...document.querySelectorAll('[data-offer]:checked')].map(n=>n.dataset.offer);if(!ids.length){$('feedback').textContent='請先勾選要確認的活動。';return;}if(basket.size){$('manualFeedback').className='error';$('manualFeedback').textContent='尚有已選商品未加入，請先加入或清除已選，再覆核活動。';return;}lock(true);$('step').textContent='目前狀態：確認中';google.script.run.withSuccessHandler(r=>{data=null;lock(false);$('step').textContent='目前狀態：成功'+r.success+'個，未完成'+r.failed+'個';$('next').textContent='可重新讀取查看最新狀態；未完成項目修正後再處理，未發布。';$('feedback').className=r.failed?'error':'success';$('feedback').textContent=r.results.map(x=>(x.success?'成功':'未完成')+'｜'+(x.name||x.id)+'：'+x.message).join('\n');}).withFailureHandler(fail).confirmMarketingReview(data.token,ids,REVIEW_VERSION);};
$('add').onclick=()=>{if(busy||!data||!basket.size)return;lock(true);$('manualFeedback').className='notice';$('manualFeedback').textContent='正在批次加入並回讀核對；尚未覆核活動…';google.script.run.withSuccessHandler(r=>{const previous=data;basket.clear();searchData=null;$('results').replaceChildren();$('results').hidden=true;$('searchCount').textContent='';const offers=previous.offers.map(o=>r.preview.offers.find(x=>x.id===o.id)||o);render({...r.preview,offers});$('manualFeedback').className='success';$('manualFeedback').textContent=r.message;$('sku').value='';$('next').textContent='下一步：可繼續搜尋新增；全部完成後核對活動卡片，再到最下方統一覆核。';$('sku').focus();}).withFailureHandler(manualFail).addMarketingProducts(targetId,data.run,[...basket.keys()],REVIEW_VERSION);};
window.addEventListener('error',()=>{if(!data){$('step').textContent='目前狀態：介面載入未完成';$('next').textContent='請關閉後重新開啟；若仍空白，請使用僅登入公司帳號的Chrome個人資料。已保存的活動不變。';}});
load();
setTimeout(()=>{if(busy&&!data){$('next').textContent='仍在核對來源與商品主檔，尚未完成。請勿重複送出；可等候或關閉後從選單重新開啟。';}},20000);
</script></body></html>
