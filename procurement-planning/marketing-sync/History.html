<!doctype html><html lang="zh-Hant"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#fbf8f1;color:#17324d;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC",sans-serif}main{padding:18px;overflow-wrap:anywhere}h1{font-size:22px;margin:0 0 10px}h2{font-size:18px;margin:0}.guide,.card{padding:16px;border:1px solid #d8e4e8;border-radius:14px;background:white;margin:12px 0}.guide{background:#edf6f8}.fields{display:grid;grid-template-columns:150px minmax(0,1fr) 160px;gap:12px}.fields label{min-width:0}select,button{font:inherit;max-width:100%;padding:10px;border:1px solid #b5ccd5;border-radius:9px}select{width:100%;display:block;background:white;color:inherit}button{background:#176b87;color:white;cursor:pointer}button.secondary{background:white;color:#153f63}button:disabled{opacity:.5;cursor:default}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}.muted,small{color:#64778a}#status{white-space:pre-wrap}details{margin:8px 0}summary{cursor:pointer}li{margin:8px 0}.products{max-height:300px;overflow:auto}.error{color:#993c29}button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #176b87;outline-offset:2px}@media(max-width:620px){.fields{grid-template-columns:1fr}main{padding:10px}.actions button{flex:1}}
</style></head><body><main><h1>行銷活動歷史查詢</h1><div class="guide"><strong>唯讀查看歷史，日常工作月份保持不變</strong><p>選擇月份與同步版本後按「查詢」。舊活動、商品勾選與覆核狀態依保存內容顯示；不重新同步、不變更勾選、不覆核或發布。</p><p>要繼續處理某月份，請關閉後使用「接續既有月份（保留覆核）」。</p></div><div class="fields"><label>月份<select id="period"></select></label><label>同步版本<select id="run"></select></label><label>案型<select id="type"><option value="all">全部案型</option><option>活動案型</option><option>贈品／加價購案型</option></select></label></div><div class="actions"><button id="query">查詢</button><button id="close" class="secondary">關閉</button></div><p id="status" role="status" aria-live="polite">選擇後查詢，尚未讀取活動明細。</p><p id="summary"></p><section id="offers"></section><div class="actions"><button id="prev" class="secondary" disabled>上一頁活動</button><button id="next" class="secondary" disabled>下一頁活動</button></div><script type="application/json" id="seed"><?!= seedJson ?></script><script>
const seed=JSON.parse(document.getElementById('seed').textContent),$=id=>document.getElementById(id),el=(tag,text)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n};let busy=false,data=null;
function options(){const period=$('period').value;$('run').replaceChildren();seed.entries.filter(e=>e.period===period).forEach(e=>{const o=el('option',e.time+'｜'+e.run+(e.run===seed.current?'（目前工作版本）':''));o.value=e.run;$('run').append(o)});$('query').disabled=!$('run').value;}
[...new Set(seed.entries.map(e=>e.period))].sort().reverse().forEach(p=>{const o=el('option',p);o.value=p;$('period').append(o)});options();
function lock(v){busy=v;['period','run','type','query','prev','next'].forEach(id=>$(id).disabled=v);if(!v){$('query').disabled=!$('run').value;$('prev').disabled=!data||!data.offset;$('next').disabled=!data?.hasMore;}}
function fail(e){lock(false);$('status').className='error';$('status').textContent='查詢未完成：'+(e.message||String(e))+'。原資料與目前工作月份未變更。';}
function productPage(parent,id,offset){if(busy)return;busy=true;parent.replaceChildren(el('p','正在讀取保存的商品明細…'));google.script.run.withSuccessHandler(r=>{busy=false;parent.replaceChildren();const ul=el('ul');ul.className='products';r.rows.forEach(p=>ul.append(el('li',(p.selected?'已選':'未選')+'｜'+p.sku+'｜'+p.name+'｜'+p.status)));parent.append(el('p','商品'+r.total+'筆；本頁第'+(r.total?offset+1:0)+'～'+(offset+r.rows.length)+'筆'),ul);const actions=el('div');actions.className='actions';for(const [label,next,disabled] of [['上一頁商品',Math.max(0,offset-100),!offset],['下一頁商品',offset+100,!r.hasMore]]){const b=el('button',label);b.className='secondary';b.disabled=disabled;b.onclick=()=>productPage(parent,id,next);actions.append(b)}parent.append(actions)}).withFailureHandler(e=>{busy=false;parent.replaceChildren(el('p','商品明細未取得：'+(e.message||e)));}).loadMarketingHistoryProducts({version:seed.version,run:data.entry.run,id,offset});}
function render(r){data=r;lock(false);$('offers').replaceChildren();$('status').className='';$('status').textContent='查詢完成（唯讀）：'+r.entry.period+'；共'+r.total+'個活動，本頁'+r.offers.length+'個。';$('summary').textContent='保存時間：'+r.entry.time+'；版本：'+r.entry.run+'；來源解析：'+r.entry.parser+'。歷史狀態不代表目前仍適用。';r.offers.forEach(o=>{const c=el('article');c.className='card';c.append(el('h2',o.name+'｜'+o.id),el('p',o.sheet+'｜'+o.status+'｜候選'+o.count+'筆／已選'+o.selected+'筆'),el('p','期間：'+o.period),el('p','適用：'+o.scope));if(o.warning){const warning=el('p',o.warning);warning.className='error';c.append(warning)}const terms=el('details');terms.append(el('summary','查看優惠內容與限制'),el('p',o.conditions),el('p','排除：'+o.exclusions),el('p','備註：'+o.notes));c.append(terms);if(o.count){const d=el('details'),p=el('div');let opened=false;d.append(el('summary','查看歷史商品明細（唯讀）'),p);d.ontoggle=()=>{if(d.open&&!opened){if(busy){p.textContent='另一項查詢處理中，請收合後再開啟。';return;}opened=true;productPage(p,o.id,0)}};c.append(d)}$('offers').append(c)})}
function load(offset=0){if(busy||!$('run').value)return;lock(true);$('status').className='';$('status').textContent='正在讀取歷史版本；不更動目前工作月份…';google.script.run.withSuccessHandler(render).withFailureHandler(fail).loadMarketingHistory({version:seed.version,run:$('run').value,type:$('type').value,offset})}
$('period').onchange=()=>{data=null;options();$('offers').replaceChildren();$('prev').disabled=true;$('next').disabled=true};$('run').onchange=$('type').onchange=()=>{data=null;$('prev').disabled=true;$('next').disabled=true};$('query').onclick=()=>load();$('prev').onclick=()=>load(Math.max(0,data.offset-20));$('next').onclick=()=>load(data.offset+20);$('close').onclick=()=>google.script.host.close();
</script></main></body></html>
