<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>門市訂單系統設定｜翔仔居家</title><meta http-equiv="Content-Security-Policy" content="default-src 'self';script-src 'self';style-src 'self';connect-src 'self';object-src 'none';base-uri 'none';form-action 'none'"><link rel="stylesheet" href="/site.css?v=20261031-store-orders-r37"><link rel="stylesheet" href="style.css?v=20261031-store-orders-r37"><script type="module" src="settings.js?v=20261031-store-orders-r37"></script></head><body><main class="page-shell"><header class="topbar"><a class="brand" href="/">翔仔居家・公司工具</a><span class="internal-badge">最高權限專用</span></header><nav class="breadcrumb"><a href="/">公司工具首頁</a>／<a href="/store-orders/?deploy=20261031-store-orders-r37">門市訂單</a>／系統設定</nav><div id="version-warning" class="notice danger" hidden>無法確認版本或版本不同，請重新載入最新版。<button id="reload-version">重新載入最新版</button></div><h1>門市訂單系統設定</h1><p>此頁僅供最高權限帳號處理初次設定與連線異常。日常收單、覆核、結算不需要到此操作。</p><section class="card"><h2>雲端儲存狀態</h2><p id="storage-status" role="status">正在確認存取權限與設定狀態…</p><button id="storage-retry" class="secondary" hidden>重新讀取設定狀態</button><div id="storage-controls" hidden><p id="storage-owner"></p><p>已設定時授權按鈕會鎖定。若遇到儲存或交接問題，先檢查連線；暫時斷線或資料夾權限異常不會直接要求重新授權。</p><div class="actions"><button id="storage-check" class="secondary">檢查雲端連線</button><button id="storage-complete" hidden>完成初始資料夾設定</button></div><div id="storage-repair" hidden><p class="notice">Google授權包含查看、編輯、建立及刪除Drive檔案；工具程式限制操作指定POS資料夾，背景憑證加密保存。此步驟會前往Google，由資料夾擁有者確認。</p><label class="check"><input id="storage-confirm" type="checkbox">我已確認這是首次啟用，或系統已確認原授權失效，需要進行授權。</label></div><button id="storage-authorize" disabled>已設定，無須重新授權</button></div></section><footer><a href="/store-orders/?deploy=20261031-store-orders-r37">返回門市訂單工具</a></footer></main></body></html>
